; Configuracao SMTP para envio do relatorio automatico da carteira.
; Copie para email.ini e preencha com seus dados.
;
; GMAIL (remetente @gmail.com):
; - Ative verificacao em duas etapas na conta Google.
; - Crie uma "Senha de app" (16 caracteres) em:
;   https://myaccount.google.com/apppasswords
; - Use essa senha no campo "senha" abaixo (NAO a senha normal do Gmail).
;
; OUTLOOK / HOTMAIL (remetente @hotmail.com, @outlook.com):
; servidor = smtp-mail.outlook.com
; porta = 587
; usar_tls = sim
;
; A senha pode ficar aqui OU na variavel de ambiente SMTP_SENHA (.env).

[SMTP]
servidor = smtp.gmail.com
porta = 587
usuario = seu-email@gmail.com
senha =
remetente = seu-email@gmail.com
usar_tls = sim
