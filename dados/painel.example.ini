; Configuracao do painel — copie para painel.ini ou edite painel.ini

[PAINEL]
; Maximo de linhas nas abas Em alta, Em queda e Todas (1 a 100)
quantidade_acoes = 10

; Quantidade padrao na janela Grafico da acao (simulacao de compra, 1 a 9999999)
quantidade_cotas_grafico = 100

; Valor padrao nas simulacoes de renda fixa e Tesouro (em reais, ex.: 10000.00)
valor_simulacao_renda_fixa = 10000.00

; Valor disponivel na tela Calcular quantidade do grafico (ex.: 10000.00)
valor_disponivel_calcular_quantidade = 10000.00

; Aparencia da interface: claro ou escuro
modo_aparencia = claro

; Miniaturas nas noticias: nenhum, pequeno, medio ou grande
fotos_noticias = medio

; Fonte das grids de cotacoes: pequeno, medio ou grande
fonte_grid = medio

; Atualizacao automatica de cotacoes em todos os paineis: sim ou nao
atualizacao_automatica = nao

; Intervalo da atualizacao automatica em segundos (10 a 3600; padrao 60)
atualizacao_automatica_intervalo_segundos = 60

; Atualizacao automatica exclusiva da tela Monitoramento: sim ou nao
monitoramento_atualizacao_automatica = nao

; Intervalo da atualizacao do monitoramento em segundos (10 a 3600; padrao 60)
monitoramento_atualizacao_intervalo_segundos = 60

; Monitoramento pausado (sim) ou ativo (nao) — interrompe atualizacao automatica de alertas
monitoramento_pausado = nao

; Variacao (%) sobre o preco de compra para limites de monitoramento da carteira (1 a 50)
carteira_variacao_monitoramento_pct = 10

; Maximo de criptos nas abas Em alta, Em queda e Todas (1 a 80)
quantidade_cripto = 15

; Servidor de noticias de mercado (geral, brasil_ibovespa, eua_wall_street, europa, etc.)
; provedor_noticias = brasil_blue_chips

; Servidor de noticias de criptomoedas (cripto_geral, cripto_top3, cripto_bitcoin, etc.)
; provedor_noticias_cripto = cripto_geral

[JANELA]
; Monitor da janela principal (DISPLAY1, DISPLAY2, ...). Gravado ao mover a janela.
; Se o monitor nao existir na proxima abertura, usa o monitor principal.
; monitor_dispositivo = DISPLAY2
