# DEPRECADO — conexao com API Render desativada no mobile e desktop.
# App Android usa API local (executar_api.bat + gerar_apk.bat).
# Deploy historico no Render: https://render.com
services:
  - type: web
    name: financeiro-api
    runtime: docker
    plan: free
    healthCheckPath: /api/saude
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: FINANCEIRO_API_KEY
        generateValue: true
      - key: FINANCEIRO_CORS_ORIGENS
        value: "*"
