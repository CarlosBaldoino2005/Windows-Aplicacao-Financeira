# Deploy gratuito no Render: https://render.com
# Celular fisico usa esta API (gerar_apk.bat). Emulador usa API local.
services:
  - type: web
    name: financeiro-api
    runtime: docker
    plan: free
    healthCheckPath: /api/saude
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: FINANCEIRO_API_KEY
        generateValue: true
      - key: FINANCEIRO_CORS_ORIGENS
        value: "*"
