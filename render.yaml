# DESATIVADO — o projeto usa apenas API local (executar_api.bat).
# Mantido como referencia; nao faca deploy ate reativar explicitamente.
# Deploy gratuito no Render: https://render.com
services:
  - type: web
    name: financeiro-api
    runtime: docker
    plan: free
    healthCheckPath: /api/saude
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: FINANCEIRO_API_KEY
        generateValue: true
      - key: FINANCEIRO_CORS_ORIGENS
        value: "*"
